<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SocialScore — Timeline</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>
    <div class="noise"></div>
  </div>

  <!-- MAIN -->
  <div class="glass">

    <!-- NAV -->
    <div class="topbar">
      <div class="logo">SOCIALSCORE</div>
      <div>
        <a href="index.html" style="margin-right:15px; color:white;">Dashboard</a>
        <a href="timeline.html" style="color:white;">Timeline</a>
      </div>
    </div>

    <!-- TITLE -->
    <h2 style="margin-bottom: 20px;">Reputation History</h2>

    <!-- TIMELINE LIST -->
    <div class="activity-list">

      <div class="activity-item">
        <span>Paid rent on time</span>
        <span class="plus">+12</span>
      </div>

      <div class="activity-item">
        <span>Missed class attendance</span>
        <span class="minus">-8</span>
      </div>

      <div class="activity-item">
        <span>5-star restaurant review</span>
        <span class="plus">+6</span>
      </div>

      <div class="activity-item">
        <span>Late bill payment</span>
        <span class="minus">-10</span>
      </div>

      <div class="activity-item">
        <span>Community event participation</span>
        <span class="plus">+15</span>
      </div>

    </div>

  </div>

</body>
</html>
