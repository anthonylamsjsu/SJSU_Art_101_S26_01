<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialScore</title>

  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="background">
    <div class="noise"></div>
    <div class="blob blob1" id="blob1"></div>
    <div class="blob blob2" id="blob2"></div>
    <div class="blob blob3" id="blob3"></div>
    <div class="blob blob4" id="blob4"></div>
  </div>

  <main class="glass">

    <div class="topbar">
      <h1 class="logo">SOCIALSCORE</h1>
      <div>
        <a href="index.html">Dashboard</a>
        <a href="timeline.html">Timeline</a>
      </div>
    </div>

    <section class="hero">
      <div>
        <p class="eyebrow">Current SocialScore</p>

        <div class="score-wrap">
          <h2 id="score">742</h2>
          <span>/ 1000</span>
        </div>

        <p class="subtitle">
          Your reputation determines access, trust, and opportunity.
        </p>

        <input
          type="range"
          min="0"
          max="1000"
          value="742"
          id="scoreSlider"
          oninput="updateScore(this.value)"
        />
      </div>

      <div class="card">
        <p>Access Level</p>
        <h3 id="status">Trusted Citizen</h3>
      </div>
    </section>

    <section class="grid">

      <div class="card">
        <h3>Score Activity</h3>
        <p>Community Service +15</p>
        <p>Rent Paid +5</p>
        <p>Late Payment -3</p>
      </div>

      <div class="card">
        <h3>Reputation Trend</h3>

        <div class="graph">
          <div class="bar-group">
            <div class="bar good" style="height:40%"></div>
            <span>JAN</span>
          </div>
          <div class="bar-group">
            <div class="bar mid" style="height:60%"></div>
            <span>FEB</span>
          </div>
          <div class="bar-group">
            <div class="bar bad" style="height:30%"></div>
            <span>MAR</span>
          </div>
          <div class="bar-group">
            <div class="bar good" style="height:80%"></div>
            <span>APR</span>
          </div>
        </div>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
